apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapplication-v1
  labels:
    app: nginx-v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-v1
  template:
    metadata:
      labels:
        app: nginx-v1
    spec:
      containers:
      - name: nginx
        image: kmannedev/dockerimageversion1:v1.0
        ports:
        - containerPort: 80